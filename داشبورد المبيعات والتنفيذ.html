<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>داشبورد المبيعات والتنفيذ</title>
    <style>
      :root {
        --bg: #f4f6f9;
        --fg: #1b2430;
        --muted: #667085;
        --card: #fff;
        --line: #dde2ea;
        --ac: #1f4e78;
        --acf: #fff;
        --dup: #fff2cc;
        --err: #c0392b;
        --ok: #1e8e4e;
        --ok2: #d9f2e3;
        --warn: #fff0d6;
        --link: #0563c1;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #10151c;
          --fg: #e6ebf2;
          --muted: #98a2b3;
          --card: #1a212b;
          --line: #2c3644;
          --ac: #4a90d9;
          --dup: #4a3f12;
          --err: #ff7b6b;
          --ok: #4cc380;
          --ok2: #17382a;
          --warn: #43361a;
          --link: #6cb2f5;
        }
      }
      :root[data-theme="dark"] {
        --bg: #10151c;
        --fg: #e6ebf2;
        --muted: #98a2b3;
        --card: #1a212b;
        --line: #2c3644;
        --ac: #4a90d9;
        --dup: #4a3f12;
        --err: #ff7b6b;
        --ok: #4cc380;
        --ok2: #17382a;
        --warn: #43361a;
        --link: #6cb2f5;
      }
      html {
        height: 100%;
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font:
          14px "Segoe UI",
          Tahoma,
          Arial,
          sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      input,
      select {
        -webkit-user-select: text;
        user-select: text;
        font: inherit;
        color: var(--fg);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
        outline: none;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 0;
        border-radius: 8px;
        padding: 8px 14px;
        background: var(--ac);
        color: var(--acf);
      }
      #app {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .top {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 10px 12px;
        background: var(--card);
        border-bottom: 1px solid var(--line);
      }
      .top b {
        font-size: 15px;
      }
      .me {
        margin-inline-start: auto;
        color: var(--muted);
        font-size: 13px;
      }
      .tab {
        background: transparent;
        color: var(--fg);
        border: 1px solid var(--line);
      }
      .tab.on {
        background: var(--ac);
        color: var(--acf);
        border-color: var(--ac);
      }
      .v {
        display: none;
        flex: 1;
        min-height: 0;
        flex-direction: column;
      }
      .v.on {
        display: flex;
      }
      .kpis {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 10px 12px;
      }
      .kpi {
        flex: 1;
        min-width: 110px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 12px;
      }
      .kpi span {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      .kpi b {
        font-size: 20px;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 0 12px 10px;
        align-items: center;
      }
      .bar input {
        flex: 1;
        min-width: 130px;
      }
      .cnt {
        margin-inline-start: auto;
        color: var(--muted);
        font-size: 13px;
      }
      #vp {
        flex: 1;
        overflow: auto;
        position: relative;
      }
      #hd {
        display: flex;
        position: sticky;
        top: 0;
        z-index: 2;
        height: 36px;
      }
      #hd div {
        flex: none;
        background: var(--ac);
        color: var(--acf);
        font-weight: 700;
        padding: 0 8px;
        line-height: 36px;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
      }
      #sp {
        position: relative;
      }
      #rows {
        position: absolute;
        inset-inline: 0;
        top: 0;
      }
      .row {
        display: flex;
        height: 40px;
        border-bottom: 1px solid var(--line);
        background: var(--card);
        align-items: center;
      }
      .row.d {
        background: var(--dup);
      }
      .c {
        flex: none;
        padding: 0 8px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .l {
        direction: ltr;
        text-align: center;
      }
      .k {
        color: var(--link);
        cursor: pointer;
        text-decoration: underline;
        text-align: center;
      }
      .chip {
        padding: 5px 0;
        width: 68px;
        margin: 0 3px;
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--line);
        font-size: 12px;
      }
      .chip.on {
        background: var(--ok2);
        color: var(--ok);
        border-color: var(--ok);
        font-weight: 700;
      }
      .pane {
        padding: 12px;
        overflow: auto;
        flex: 1;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 10px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        background: var(--card);
      }
      th,
      td {
        border: 1px solid var(--line);
        padding: 7px 9px;
        text-align: start;
        white-space: nowrap;
      }
      th {
        background: var(--ac);
        color: var(--acf);
      }
      td select {
        padding: 4px;
      }
      .s0 {
        background: var(--card);
      }
      .s1 {
        background: var(--warn);
      }
      .s2 {
        background: var(--ok2);
      }
      .lock {
        margin: auto;
        max-width: 340px;
        text-align: center;
      }
      .lock input {
        width: 100%;
        margin: 10px 0;
        text-align: center;
        direction: ltr;
      }
      .msg {
        color: var(--err);
        min-height: 18px;
        font-size: 13px;
      }
      .muted {
        color: var(--muted);
      }
      #ov {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 20;
      }
      #ov.on {
        display: flex;
      }
      #ov .card {
        max-width: 320px;
        text-align: center;
      }
      #toast {
        position: fixed;
        bottom: 16px;
        inset-inline: 16px;
        margin: auto;
        max-width: 420px;
        background: #222;
        color: #fff;
        border-radius: 8px;
        padding: 10px 14px;
        display: none;
        z-index: 30;
        text-align: center;
      }
      #wm {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9;
        opacity: 0.06;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='170'><text x='20' y='95' font-size='20' font-family='Arial' fill='%23888' transform='rotate(-24 130 85)'>سري - لا يُنسخ</text></svg>");
      }
      .hid .v {
        filter: blur(16px);
      }
      @media print {
        body {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="top">
        <b>📊 داشبورد المبيعات والتنفيذ</b
        ><span id="tabs" style="display: flex; gap: 6px; flex-wrap: wrap"></span
        ><span class="me" id="me"></span
        ><button id="lo" class="tab" style="display: none">خروج</button>
      </div>
      <div class="v" id="v-boot">
        <div class="pane">
          <div class="card muted" id="boot">جاري التحميل...</div>
        </div>
      </div>
      <div class="v" id="v-login">
        <div class="pane">
          <div class="card lock">
            <div style="font-size: 32px">👤</div>
            <p>سجّل دخول بحسابك</p>
            <input id="lu" placeholder="اسم الدخول" autocomplete="off" /><input
              id="lp"
              type="password"
              placeholder="الباسورد"
              autocomplete="off"
            /><button id="lg" style="width: 100%">دخول</button>
            <div class="msg" id="lm"></div>
          </div>
        </div>
      </div>
      <div class="v" id="v-leads"></div>
      <div class="v" id="v-clients"><div class="pane" id="cl"></div></div>
      <div class="v" id="v-stats"><div class="pane" id="st"></div></div>
      <div class="v" id="v-users"><div class="pane" id="us"></div></div>
    </div>
    <div id="ov">
      <div class="card">
        <p id="ovm"></p>
        <button id="ovy">تأكيد</button>
        <button id="ovn" class="tab">إلغاء</button>
      </div>
    </div>
    <div id="toast"></div>
    <div id="wm"></div>

      async function decryptAll(pw) {
        const km = await crypto.subtle.importKey(
          "raw",
          new TextEncoder().encode(pw),
          "PBKDF2",
          false,
          ["deriveKey"],
        );
        const key = await crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt: b2u(SALT),
            iterations: ITER,
            hash: "SHA-256",
          },
          km,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"],
        );
        const p = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: b2u(IV) },
          key,
          b2u(DATA),
        );
        return JSON.parse(
          await new Response(
            new Blob([p]).stream().pipeThrough(new DecompressionStream("gzip")),
          ).text(),
        );
      }

                  return;

                await db.doc("users/" + i).set(await mkCred(p));
              }
              toast("تم الحفظ ✓");
            } catch (e) {
              toast("مقدرتش أحفظ");
            }
          };
          tr.querySelector(".ed").onclick = async () => {
            if (
              !(await ask(
                "هتمسح المستخدم " +
                  nm(i) +
                  "؟ العملاء المعيّنين ليه هيرجعوا غير معيّنين.",
              ))
            )
              return;
            try {
              const j = [];
              AS.forEach((x, id) => {
                if (x.u === i) j.push(db.doc("asg/" + id).delete());
              });
              await Promise.all(j);
              await db.doc("profiles/" + i).delete();
              await db.doc("users/" + i).delete();
              toast("تم المسح");
            } catch (e) {
              toast("مقدرتش أمسح");
            }
          };
        });
      }
      init();
    </script>
  </body>
</html>
